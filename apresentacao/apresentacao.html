te-space:nowrap;animation:fadeUp .4s ease-out both}\n.arrowcol svg{width:100%}\n.arrowcol line{stroke-dasharray:6 5;animation:dashFlow .7s linear infinite}\n.explain{display:flex;flex-direction:column;gap:6px;animation:fadeUp .5s ease-out both}\n.explain .tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em}\n.explain p{margin:0;font-size:13px;color:#A9B2C3;line-height:1.5}\n@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}\n@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}\n@keyframes dashFlow{to{stroke-dashoffset:-11}}\n.eyebrow{animation:fadeUp .55s ease-out both}\nh1{animation:fadeUp .6s ease-out .08s both}\n\u003C/style>\n\u003C/helmet>\n\u003Cdiv class=\"slide\">\n  \u003Cdiv class=\"grid-bg\">\u003C/div>\n  \u003Cdiv style=\"position:relative;z-index:1;display:flex;flex-direction:column;gap:6px\">\n    \u003Cdiv class=\"eyebrow\" style=\"color:#7DA8FF\">Fundamento biológico\u003C/div>\n    \u003Ch1 style=\"font-family:'Newsreader',serif;font-weight:600;font-size:44px;margin:4px 0 4px\">O Dogma Central da Biologia Molecular\u003C/h1>\n    \u003Cp style=\"margin:0 0 26px;font-size:15px;color:#93A0B4;max-width:820px;animation:fadeUp .6s ease-out .16s both\">Toda célula segue o mesmo roteiro para transformar informação genética em moléculas funcionais. Este projeto simula cada etapa, uma fase por vez.\u003C/p>\n  \u003C/div>\n\n  \u003Cdiv style=\"position:relative;z-index:1;display:flex;align-items:center;gap:6px;margin-bottom:36px\">\n    \u003Cdiv class=\"stage\" style=\"animation-delay:.3s\">\u003Cb>DNA\u003C/b>\u003Cspan>fita molde {A,T,C,G}\u003C/span>\u003C/div>\n    \u003Cdiv class=\"arrowcol\">\n      \u003Cspan class=\"lbl\" style=\"color:#E4A046;animation-delay:.4s\">TRANSCRIÇÃO (T&#8594;U)\u003C/span>\n      \u003Csvg height=\"14\" viewBox=\"0 0 100 14\" preserveAspectRatio=\"none\">\u003Cline x1=\"2\" y1=\"7\" x2=\"90\" y2=\"7\" stroke=\"#E4A046\" stroke-width=\"2.5\"/>\u003Cpath d=\"M84 2 L94 7 L84 12 Z\" fill=\"#E4A046\"/>\u003C/svg>\n    \u003C/div>\n    \u003Cdiv class=\"stage\" style=\"animation-delay:.42s\">\u003Cb>pré&#8209;mRNA\u003C/b>\u003Cspan>cópia bruta, com íntrons\u003C/span>\u003C/div>\n    \u003Cdiv class=\"arrowcol\">\n      \u003Cspan class=\"lbl\" style=\"color:#35C2B0;animation-delay:.52s\">SPLICING + MATURAÇÃO\u003C/span>\n      \u003Csvg height=\"14\" viewBox=\"0 0 100 14\" preserveAspectRatio=\"none\">\u003Cline x1=\"2\" y1=\"7\" x2=\"90\" y2=\"7\" stroke=\"#35C2B0\" stroke-width=\"2.5\"/>\u003Cpath d=\"M84 2 L94 7 L84 12 Z\" fill=\"#35C2B0\"/>\u003C/svg>\n    \u003C/div>\n    \u003Cdiv class=\"stage\" style=\"animation-delay:.54s\">\u003Cb>mRNA maduro\u003C/b>\u003Cspan>CAP 5' + cauda poli&#8209;A\u003C/span>\u003C/div>\n    \u003Cdiv class=\"arrowcol\">\n      \u003Cspan class=\"lbl\" style=\"color:#C77DFF;animation-delay:.64s\">TRADUÇÃO (RIBOSSOMO)\u003C/span>\n      \u003Csvg height=\"14\" viewBox=\"0 0 100 14\" preserveAspectRatio=\"none\">\u003Cline x1=\"2\" y1=\"7\" x2=\"90\" y2=\"7\" stroke=\"#C77DFF\" stroke-width=\"2.5\"/>\u003Cpath d=\"M84 2 L94 7 L84 12 Z\" fill=\"#C77DFF\"/>\u003C/svg>\n    \u003C/div>\n    \u003Cdiv class=\"stage\" style=\"animation-delay:.66s\">\u003Cb>Proteína\u003C/b>\u003Cspan>cadeia de aminoácidos\u003C/span>\u003C/div>\n  \u003C/div>\n\n  \u003Cdiv style=\"position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:40px;border-top:1px solid rgba(244,241,234,.1);padding-top:22px\">\n    \u003Cdiv class=\"explain\" style=\"animation-delay:.78s\">\u003Cspan class=\"tag\" style=\"color:#E4A046\">FASE I &#8212; BIOCOMPILER 1.0\u003C/span>\u003Cp>Cada timina (T) do DNA é substituída por uracila (U), gerando o pré&#8209;mRNA bruto.\u003C/p>\u003C/div>\n    \u003Cdiv class=\"explain\" style=\"animation-delay:.86s\">\u003Cspan class=\"tag\" style=\"color:#35C2B0\">FASE II &#8212; BIOCOMPILER 2.0\u003C/span>\u003Cp>Trechos não&#8209;codificantes (íntrons) são removidos; a molécula ganha CAP e cauda poli&#8209;A.\u003C/p>\u003C/div>\n    \u003Cdiv class=\"explain\" style=\"animation-delay:.94s\">\u003Cspan class=\"tag\" style=\"color:#C77DFF\">FASE III &#8212; RIBOSSOMO 1.0\u003C/span>\u003Cp>O ribossomo lê o mRNA em trincas (códons) e monta a cadeia de aminoácidos.\u003C/p>\u003C/div>\n  \u003C/div>\n\n  \u003Cdiv class=\"footer\">\n    \u003Cspan>Tópicos em Bioinformática &middot; UFPI/DC&#8209;CCN\u003C/span>\n    \u003Cspan class=\"dim\">FUNDAMENTO BIOLÓGICO\u003C/span>\n    \u003Cdiv style=\"display:flex;align-items:center;gap:14px\">\n      \u003Ca class=\"footer-link\" href=\"Slide02-Sumario.dc.html\">&#8592;\u003C/a>\n      \u003Cspan class=\"pagenum\">03 / 13\u003C/span>\n      \u003Ca class=\"footer-link\" href=\"Slide05-FaseI.dc.html\">&#8594;\u003C/a>\n    \u003C/div>\n  \u003C/div>\n\u003C/div>\n\u003Cscript>\n(function () {\n  function go(file) { parent.postMessage({ type: 'nav', file: file }, '*'); }\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest('a.footer-link[href$=\".dc.html\"]');\n    if (a) { e.preventDefault(); go(a.getAttribute('href')); }\n  });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') parent.postMessage({ type: 'step', dir: 1 }, '*');\n    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') parent.postMessage({ type: 'step', dir: -1 }, '*');\n  });\n})();\n\u003C/script>\n\u003C/body>\n\u003C/html>\n"},{"file":"Slide05-FaseI.dc.html","title":"Fase I — DNA","html":"\u003C!doctype html>\n\u003Chtml lang=\"pt-BR\">\n\u003Chead>\n\u003Cmeta charset=\"utf-8\">\n\u003Ctitle>Fase I — DNA\u003C/title>\n\u003C/head>\n\u003Cbody>\n\u003Chelmet>\n\u003Clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap\">\n\u003Cstyle>\nbody{margin:0}\n.slide{width:1280px;height:720px;box-sizing:border-box;position:relative;overflow:hidden;background:#0B1220;color:#F4F1EA;font-family:'Manrope',sans-serif;display:flex;flex-direction:column;padding:64px 80px 0}\n.grid-bg{position:absolute;inset:0;background-image:radial-gradient(rgba(244,241,234,.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}\n.eyebrow{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}\n.dim{color:#8891A5}\n.footer{position:absolute;left:80px;right:80px;bottom:34px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(244,241,234,.14);padding-top:14px;font-size:12.5px;color:#7C88A0}\n.pagenum{font-family:'JetBrains Mono',monospace}\n.footer-link{color:#F4F1EA;text-decoration:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(244,241,234,.2);border-radius:50%}\n.footer-link:hover{background:rgba(244,241,234,.08)}\n.step{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;animation:fadeUp .45s ease-out both}\n.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid #E4A046;color:#E4A046;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.step p{margin:0;font-size:14.5px;color:#D8DEEA;line-height:1.5;padding-top:2px}\n.diag{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(244,241,234,.08);animation:fadeUp .4s ease-out both}\n.diag .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;animation:pulseSoft 2.4s ease-in-out infinite}\n.diag b{font-family:'JetBrains Mono',monospace;font-size:12.5px}\n.diag span{font-size:12px;color:#8891A5;margin-left:auto;text-align:right}\n@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}\n@keyframes pulseSoft{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}\n.eyebrow{animation:fadeUp .55s ease-out both}\nh1{animation:fadeUp .6s ease-out .08s both}\n\u003C/style>\n\u003C/helmet>\n\u003Cdiv class=\"slide\">\n  \u003Cdiv class=\"grid-bg\">\u003C/div>\n  \u003Cdiv style=\"position:relative;z-index:1;display:flex;flex-direction:column;gap:6px\">\n    \u003Cdiv class=\"eyebrow\" style=\"color:#E4A046\">Fase I &middot; DNA &#8594; pré&#8209;mRNA\u003C/div>\n    \u003Ch1 style=\"font-family:'Newsreader',serif;font-weight:600;font-size:42px;margin:4px 0 22px\">BioCompiler 1.0 &#8212; Transcrição\u003C/h1>\n  \u003C/div>\n\n  \u003Cdiv style=\"position:relative;z-index:1;flex:1;display:grid;grid-template-columns:1.15fr 0.85fr;column-gap:56px\">\n    \u003Cdiv>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.2s\">\u003Cdiv class=\"n\">1\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Valida o alfabeto\u003C/strong> &#8212; a fita só pode conter as bases canônicas \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">A, T, C, G\u003C/span>.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.27s\">\u003Cdiv class=\"n\">2\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Localiza o START\u003C/strong> &#8212; busca a primeira ocorrência do códon iniciador \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">ATG\u003C/span>.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.34s\">\u003Cdiv class=\"n\">3\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Lê em trincas\u003C/strong> &#8212; a partir do START, varre a sequência em grupos de 3 bases (o quadro de leitura).\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.41s\">\u003Cdiv class=\"n\">4\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Procura o STOP\u003C/strong> &#8212; dentro do quadro de leitura, busca \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">TAA\u003C/span>, \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">TAG\u003C/span> ou \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">TGA\u003C/span>.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.48s\">\u003Cdiv class=\"n\">5\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Transcreve\u003C/strong> &#8212; se tudo é válido, substitui cada T por U, gerando o pré&#8209;mRNA.\u003C/p>\u003C/div>\n\n      \u003Cdiv style=\"margin-top:20px;padding:14px 18px;border-radius:10px;background:rgba(228,160,70,.08);border:1px solid rgba(228,160,70,.3);font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#F0D5A8;animation:fadeUp .5s ease-out .58s both\">\n        DNA: ATGGCTAAACCGTAA &#8594; pré&#8209;mRNA: AUGGCUAAACCGUAA\n      \u003C/div>\n    \u003C/div>\n\n    \u003Cdiv>\n      \u003Cdiv class=\"dim\" style=\"font-size:11.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;margin-bottom:2px;animation:fadeUp .4s ease-out .2s both\">DIAGNÓSTICOS POSSÍVEIS\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.28s\">\u003Cdiv class=\"dot\" style=\"background:#35C2B0\">\u003C/div>\u003Cb>CORRETO\u003C/b>\u003Cspan>Transcrição bem-sucedida\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.34s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.3s\">\u003C/div>\u003Cb>BUG &#8212; base inválida\u003C/b>\u003Cspan>Caractere fora de {A,T,C,G}\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.4s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.5s\">\u003C/div>\u003Cb>BUG &#8212; START ausente\u003C/b>\u003Cspan>Nenhum ATG encontrado\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.46s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.7s\">\u003C/div>\u003Cb>BUG &#8212; STOP ausente\u003C/b>\u003Cspan>Nenhum STOP em fase\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.52s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.9s\">\u003C/div>\u003Cb>BUG &#8212; frameshift\u003C/b>\u003Cspan>Quadro de leitura quebrado\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.58s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:1.1s\">\u003C/div>\u003Cb>BUG &#8212; nonsense\u003C/b>\u003Cspan>STOP prematuro em fase\u003C/span>\u003C/div>\n    \u003C/div>\n  \u003C/div>\n\n  \u003Cdiv class=\"footer\">\n    \u003Cspan>Tópicos em Bioinformática &middot; UFPI/DC&#8209;CCN\u003C/span>\n    \u003Cspan class=\"dim\">FASE I\u003C/span>\n    \u003Cdiv style=\"display:flex;align-items:center;gap:14px\">\n      \u003Ca class=\"footer-link\" href=\"Slide04-DogmaCentral.dc.html\">&#8592;\u003C/a>\n      \u003Cspan class=\"pagenum\">04 / 13\u003C/span>\n      \u003Ca class=\"footer-link\" href=\"Slide06-FaseI-Exemplo.dc.html\">&#8594;\u003C/a>\n    \u003C/div>\n  \u003C/div>\n\u003C/div>\n\u003Cscript>\n(function () {\n  function go(file) { parent.postMessage({ type: 'nav', file: file }, '*'); }\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest('a.footer-link[href$=\".dc.html\"]');\n    if (a) { e.preventDefault(); go(a.getAttribute('href')); }\n  });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') parent.postMessage({ type: 'step', dir: 1 }, '*');\n    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') parent.postMessage({ type: 'step', dir: -1 }, '*');\n  });\n})();\n\u003C/script>\n\u003C/body>\n\u003C/html>\n"},{"file":"Slide06-FaseI-Exemplo.dc.html","title":"Fase I — Exemplo","html":"\u003C!doctype html>\n\u003Chtml lang=\"pt-BR\">\n\u003Chead>\n\u003Cmeta charset=\"utf-8\">\n\u003Ctitle>Fase I — Exemplo\u003C/title>\n\u003C/head>\n\u003Cbody>\n\u003Chelmet>\n\u003Clink rel=\  trecho do íntron e une os éxons adjacentes diretamente.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.41s\">\u003Cdiv class=\"n\">4\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Adiciona a CAP 5'\u003C/strong> &#8212; marcador \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">m7Gppp\u003C/span> no início da sequência processada.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.48s\">\u003Cdiv class=\"n\">5\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Adiciona a cauda poli&#8209;A\u003C/strong> &#8212; exatamente 100 adeninas na extremidade 3'.\u003C/p>\u003C/div>\n\n      \u003Cdiv style=\"margin-top:14px;padding:14px 18px;border-radius:10px;background:rgba(53,194,176,.08);border:1px solid rgba(53,194,176,.3);font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#B8E9E1;line-height:1.8;animation:fadeUp .5s ease-out .58s both\">\n        ANTES: &nbsp;EXON1 [GU ... A ... AG] EXON2\u003Cbr>\n        DEPOIS: m7Gppp EXON1EXON2 AAAA&#8230;A \u003Cspan style=\"color:#7C88A0\">(100&#215;A)\u003C/span>\n      \u003C/div>\n    \u003C/div>\n\n    \u003Cdiv>\n      \u003Cdiv class=\"dim\" style=\"font-size:11.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;margin-bottom:2px;animation:fadeUp .4s ease-out .2s both\">DIAGNÓSTICOS POSSÍVEIS\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.28s\">\u003Cdiv class=\"dot\" style=\"background:#35C2B0\">\u003C/div>\u003Cb>CORRETO\u003C/b>\u003Cspan>Íntron reconhecido e removido\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.36s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.3s\">\u003C/div>\u003Cb>BUG &#8212; sítio 5' ausente\u003C/b>\u003Cspan>Existe AG, mas não há GU anterior\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.44s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.6s\">\u003C/div>\u003Cb>B ass=\"n\">2\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Localiza o AUG\u003C/strong> &#8212; primeiro códon de iniciação após a CAP.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.3s\">\u003Cdiv class=\"n\">3\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Traduz em trincas\u003C/strong> &#8212; cada códon vira um aminoácido via código genético universal.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.36s\">\u003Cdiv class=\"n\">4\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Confere o STOP\u003C/strong> &#8212; \u003Cspan style=\"font-family:'JetBrains Mono',monospace\">UAA / UAG / UGA\u003C/span> em fase encerra a tradução.\u003C/p>\u003C/div>\n      \u003Cdiv class=\"step\" style=\"animation-delay:.42s\">\u003Cdiv class=\"n\">5\u003C/div>\u003Cp>\u003Cstrong style=\"color:#F4F1EA\">Confere a cauda poli&#8209;A\u003C/strong> &#8212; deve ter exatamente 100 adeninas.\u003C/p>\u003C/div>\n\n      \u003Cdiv class=\"dim\" style=\"font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;margin:14px 0 2px;animation:fadeUp .4s ease-out .18s both\">DIAGNÓSTICOS POSSÍVEIS\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.48s\">\u003Cdiv class=\"dot\" style=\"background:#35C2B0\">\u003C/div>\u003Cb>CORRETO\u003C/b>\u003Cspan>Tradução completa\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.53s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.3s\">\u003C/div>\u003Cb>BUG &#8212; CAP 5'\u003C/b>\u003Cspan>m7Gppp ausente\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.58s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.5s\">\u003C/div>\u003Cb>BUG &#8212; START ausente\u003C/b>\u003Cspan>Sem AUG após a CAP\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.63s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.7s\">\u003C/div>\u003Cb>BUG &#8212; STOP ausente\u003C/b>\u003Cspan>Sem STOP em fase\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.68s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:.9s\">\u003C/div>\u003Cb>BUG &#8212; quadro de leitura\u003C/b>\u003Cspan>Trincas fora de fase\u003C/span>\u003C/div>\n      \u003Cdiv class=\"diag\" style=\"animation-delay:.73s\">\u003Cdiv class=\"dot\" style=\"background:#F2665A;animation-delay:1.1s\">\u003C/div>\u003Cb>BUG &#8212; cauda poli&#8209;A\u003C/b>\u003Cspan>Não são exatas 100 adeninas\u003C/span>\u003C/div>\n    \u003C/div>\n\n    \u003Cdiv style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px\">\n      \u003Csvg width=\"380\" height=\"280\" viewBox=\"0 0 380 280\">\n        \u003Cellipse class=\"ribo-part\" style=\"animation-delay:.3s\" cx=\"190\" cy=\"95\" rx=\"150\" ry=\"80\" fill=\"rgba(199,125,255,.14)\" stroke=\"#C77DFF\" stroke-width=\"1.5\"/>\n        \u003Cellipse class=\"ribo-part\" style=\"animation-delay:.42s\" cx=\"190\" cy=\"185\" rx=\"120\" ry=\"62\" fill=\"rgba(125,168,255,.14)\" stroke=\"#7DA8FF\" stroke-width=\"1.5\"/>\n        \u003Ctext x=\"190\" y=\"70\" text-anchor=\"middle\" fill=\"#C77DFF\" font-family=\"JetBrains Mono, monospace\" font-size=\"13\" font-weight=\"700\">60S (subunidade maior)\u003C/text>\n        \u003Ctext x=\"190\" y=\"225\" text-anchor=\"middle\" fill=\"#7DA8FF\" font-family=\"JetBrains Mono, monospace\" font-size=\"13\" font-weight=\"700\">40S (subunidade menor)\u003C/text>\n        \u003Cline x1=\"20\" y1=\"185\" x2=\"360\" y2=\"185\" stroke=\"#4A5568\" stroke-width=\"3\"/>\n        \u003Crect class=\"site-box\" style=\"animation-delay:.58s\" x=\"120\" y=\"171\" width=\"34\" height=\"28\" rx=\"4\" fill=\"#0B1220\" stroke=\"#35C2B0\" stroke-width=\"1.5\"/>\n        \u003Ctext x=\"137\" y=\"190\" text-anchor=\"middle\" fill=\"#35C2B0\" font-family=\"JetBrains Mono, monospace\" font- let current = 0;
const frame = document.getElementById('frame');
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const titleEl = document.getElementById('title');
const chromeEl = document.getElementById('chrome');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const fsBtn = document.getElementById('fs');

function render() {
  const s = SLIDES[current];
  frame.srcdoc = s.html;
  counter.textContent = (current + 1) + ' / ' + SLIDES.length;
  titleEl.textContent = s.title;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
  history.replaceState(null, '', '#' + (current + 1));
}

function gotoIndex(i) {
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  render();
}
function step(dir) { gotoIndex(current + dir); }
function gotoFile(file) {
  const i = SLIDES.findIndex((s) => s.file === file);
  if (i !== -1) gotoIndex(i);
}

function fit() {
  const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720) * 0.94;
  stage.style.transform = 'scale(' + scale + ')';
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

let hideTimer;
function showChrome() {
  chromeEl.classList.add('visible');
  titleEl.classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    chromeEl.classList.remove('visible');
    titleEl.classList.remove('visible');
  }, 2600);
}

prevBtn.addEventListener('click', () => step(-1));
nextBtn.addEventListener('click', () => step(1));
fsBtn.addEventListener('click', toggleFullscreen);
window.addEventListener('resize', fit);
window.addEventListener('mousemove', showChrome);
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); showChrome(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); showChrome(); }
  else if (e.key === 'Home') gotoIndex(0);
  else if (e.key === 'End') gotoIndex(SLIDES.length - 1);
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  if (d.type === 'nav') gotoFile(d.file);
  else if (d.type === 'step') step(d.dir);
});

const initial = parseInt(location.hash.replace('#', ''), 10);
current = Number.isFinite(initial) && initial >= 1 && initial <= SLIDES.length ? initial - 1 : 0;
fit();
render();
showChrome();
</script>
